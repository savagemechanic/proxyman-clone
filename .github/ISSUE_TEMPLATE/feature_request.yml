name: Feature request
description: Propose a focused capability or workflow improvement
title: "Feature: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible workflow and expected result.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and security considerations
      description: Note protocol, performance, compatibility, privacy, or trust-boundary implications.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable outcomes make this complete?
